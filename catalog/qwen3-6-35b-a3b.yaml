apiVersion: v1
kind: ModelCatalog
metadata:
  name: qwen3-6-35b-a3b
  workspace: default
  annotations:
    recipe.vllm.ai/hardware-verified: "L40S"
spec:
  engine:
    engine: vllm
    version: v0.24.0
  base:
    engine_args:
      reasoning_parser: qwen3
  variants:
    bf16:
      description: "BF16 base model — 4x L40S (TP4); sized for 256K context x 4 concurrent seqs."
      model:
        registry: huggingface
        name: Qwen/Qwen3.6-35B-A3B
        task: text-generation
        info:
          parameter_count: "35B-A3B"
          quantization: bf16
          context_length: "262K"
          architecture: moe
      resources:
        gpu: "4"
        accelerator:
          type: nvidia
          product: L40S
      vram_minimum_gb: 110
    fp8:
      description: "Official FP8 checkpoint — 2x L40S (TP2); sized for 256K context x 4 concurrent seqs."
      model:
        registry: huggingface
        name: Qwen/Qwen3.6-35B-A3B-FP8
        task: text-generation
        info:
          parameter_count: "35B-A3B"
          quantization: fp8
          context_length: "262K"
          architecture: moe
      resources:
        gpu: "2"
        accelerator:
          type: nvidia
          product: L40S
      vram_minimum_gb: 70
    nvfp4:
      description: "NVIDIA ModelOpt NVFP4 checkpoint — NVIDIA Blackwell (DGX Spark GB10); needs vLLM nightly / ModelOpt NVFP4 support."
      model:
        registry: huggingface
        name: nvidia/Qwen3.6-35B-A3B-NVFP4
        task: text-generation
        info:
          parameter_count: "35B-A3B"
          quantization: nvfp4
          context_length: "262K"
          architecture: moe
      resources:
        gpu: "1"
        accelerator:
          type: nvidia
          product: GB200
      vram_minimum_gb: 40
      engine_args:
        trust_remote_code: true
        kv_cache_dtype: fp8
        attention_backend: flashinfer
        moe_backend: marlin
  features:
    - name: max-model-len
      group: Core
      type: input
      display_name: "Context window"
      description: "Maximum sequence length (tokens) — pick a preset or type a custom value (native max 262144)."
      input:
        value_type: int
        default: "262144"
        min: 1
        max: 262144
        suggestions:
          - { value: "8192",   label: "8K" }
          - { value: "32768",  label: "32K" }
          - { value: "131072", label: "128K" }
          - { value: "262144", label: "256K" }
      engine_args:
        max_model_len: "${value}"
    - name: max-num-seqs
      group: Core
      type: input
      display_name: "Concurrency"
      description: "Max concurrent sequences (decode parallelism / batch width)."
      input:
        value_type: int
        default: "256"
        min: 1
        max: 1024
      engine_args:
        max_num_seqs: "${value}"
    - name: tool-calling
      group: Inference
      display_name: "Tool calling"
      description: "Function / tool calling (auto tool choice, qwen3_xml parser)."
      default: false
      engine_args:
        enable_auto_tool_choice: true
        tool_call_parser: qwen3_xml
    - name: text-only
      group: Inference
      display_name: "Text-only mode"
      description: "Text-only mode — skip the vision encoder to free memory for KV cache."
      default: false
      engine_args:
        language_model_only: true
    - name: mtp-speculative
      group: Performance tuning
      display_name: "MTP speculative decoding"
      description: "MTP speculative decoding (method=mtp, 2 speculative tokens)."
      default: false
      engine_args:
        speculative_config:
          method: mtp
          num_speculative_tokens: 2
    - name: expert-parallel
      group: Performance tuning
      display_name: "Expert parallelism"
      description: "Enable MoE expert parallelism (EP) across the engine's GPUs."
      default: false
      engine_args:
        enable_expert_parallel: true
